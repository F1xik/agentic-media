name: Cleanup expired videos

on:
  # 48-hour Storage retention: delete mp4 objects whose rows have outlived the
  # window. Runs daily at 03:00 UTC, offset from generate.yml's 09:00 run.
  schedule:
    - cron: "0 3 * * *"
  # Manual run from the Actions tab.
  workflow_dispatch:

# Don't let two cleanup runs race over the same objects.
concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Delete expired videos
        run: npm run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
