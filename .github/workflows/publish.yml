name: Publish video

on:
  # Fired by the dashboard's Publish button via api/dispatch.ts, which sends
  # client_payload.video_id for the approved video.
  repository_dispatch:
    types: [publish_video]
  # Manual publish from the Actions tab; supply the video id explicitly.
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID of the approved video to publish"
        required: true
        type: string

# Don't let two dispatches for the same video race. publish.ts is already
# idempotent on youtube_id; this is belt-and-suspenders.
concurrency:
  group: publish-${{ github.event.client_payload.video_id || inputs.video_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish video
        run: npm run publish
        env:
          VIDEO_ID: ${{ github.event.client_payload.video_id || inputs.video_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
